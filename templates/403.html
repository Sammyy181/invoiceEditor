<!-- templates/403.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Access Denied</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #1e1e2f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .message-box {
      text-align: center;
      max-width: 500px;
    }

    h1 {
      font-size: 3em;
      color: #ff4d4f;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
      color: #ddd;
    }

    .role-info {
      margin-top: 20px;
      color: #999;
      font-size: 0.95em;
    }

    a {
      margin-top: 30px;
      display: inline-block;
      background-color: #444;
      padding: 10px 20px;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    a:hover {
      background-color: #666;
    }
  </style>
</head>
<body>
  <div class="message-box">
    <h1>403 - Access Denied</h1>
    <p>You do not have permission to access this page.</p>
    <div class="role-info">
      Your role: <strong>{{ role or 'Unknown' }}</strong>
    </div>
    <a href="{{ url_for('select_service') }}">Go Back to Dashboard</a>
  </div>
</body>
</html>
